[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/admi"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/services"
  to = "/services.html"
  status = 200

[[redirects]]
  from = "/formations"
  to = "/formations.html"
  status = 200

[[redirects]]
  from = "/actualites"
  to = "/actualites.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200

